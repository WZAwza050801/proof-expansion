'
judge_bundle:
  reference_proof: |
    先令 L_-=liminf_{x→0+}f(x)、L_+=limsup_{x→0+}f(x)。固定 y，由原方程知 L_+<∞，从而 xf(x)→0。当 y=x 时，2f(xf(x))=1+f(2x)，取上下极限得 2L_+=1+L_+、2L_-=1+L_-，故 lim_{0+}f=1。
    若 f≥1 处处成立，令 S_c=sup_{0<x≤c}f(x)。原方程可用于显示 S_∞ 有限；又 x↦xf(x) 从 0 连续趋于∞，故取遍正实数。由 2f(xf(x))=1+f(2x) 得 2S_∞≤1+S_∞，于是 S_∞=1，f≡1。
    以下设某处 f<1。取 I=inf f<1，选择 y 使 f(y) 接近 I。若 xf(x)=y，则 x=y 代入式给出 1+I≤2f(y)<2I+2ε，矛盾；借助 xf(x) 在零端趋零及连续性，推出 sup xf(x)<∞，因而 f(x)→0（否则会与正值连续性及原方程矛盾）。故 f^{-1}(1/2) 非空且紧。用 D3 缩放，使该集合最小元为 1。
    由 2f(xf(x))=1+f(2x)>1=f(1) 知 xf(x)≠1；连续性和零端行为强迫 xf(x)<1。又 x→∞ 时右侧趋 1/2，故 xf(x)→1。
    在原式中把 y 改为 xy：f(xf(xy))+f(xyf(x))=1+f(x+xy)。令 x→∞，用 xf(x)→1，得到 f(1/y)+f(y)=1。将其与原式合并为 f(xf(y))=f(x+y)+f(1/(yf(x)))。两边乘 xf(y)，令 x→∞，利用 xf(x)→1，得 1=f(y)+yf(y)，所以 f(y)=1/(1+y)。撤销归一化，非恒等解为 f(y)=1/(1+cy), c>0；连同 c=0 即全部解。直接代入可验证。
  key_lemmas:
  - lemma: lim_{x→0+}f(x)=1。
    why_key: 它保证零端尺度和后续 xf(x) 的连续像论证。
    applicability_conditions: 必须先由固定 y 的方程控制 limsup。
  - lemma: 非恒等分支中 lim_{x→∞}xf(x)=1（归一化后）。
    why_key: 这是导出 f(1/y)+f(y)=1 的关键。
    applicability_conditions: 需先证明 f∞=0、选择 f^{-1}(1/2) 的最小元并排除 xf(x)=1。
