writer_bundle:
  statement: |
    求所有连续函数 f:(0,∞)→(0,∞)，满足对所有 x,y>0，
    f(xf(y))+f(yf(x))=1+f(x+y)。
  proof_skeleton: '先由方程和连续性建立 lim_{x→0+}f(x)=1。分离“f≥1 处处成立”的常数分支。对非恒等分支，建立 lim_{x→∞}f(x)=0；利用尺度不变性归一化一个
    f 值为 1/2。接着从 x=y 的方程及归一化控制 xf(x)，证明其在无穷远的极限。把 y 替换为 xy 后取极限，得到倒数自变量关系，最后回代并取极限确定
    f。

'
  allowed_dependencies:
  - id: D1
    kind: standard_result
    statement: '若 g:(0,∞)→R 连续且 lim_{x→0+}g(x)=0、lim_{x→∞}g(x)=∞，则 g 的像包含 (0,∞)。

'
  - id: D2
    kind: standard_result
    statement: '连续函数在紧区间上取得最大值和最小值；若连续函数在两个点取值异号，则在其间有零点（介值定理）。

'
  - id: D3
    kind: lemma
    statement: '若 f 满足题设方程，则对任意 c>0，函数 g(x)=f(cx) 也满足同一方程。

'
