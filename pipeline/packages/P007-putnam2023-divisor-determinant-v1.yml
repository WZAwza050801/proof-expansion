writer_bundle:
  statement: |
    设 n 为正整数。对 i,j∈{1,…,n}，令 s(i,j) 是满足 ai+bj=n 的非负整数对 (a,b) 的数目。令 S=(s(i,j))_{1≤i,j≤n}。证明
    det S=(-1)^{⌈n/2⌉-1}·2⌈n/2⌉。
  proof_skeleton: '令 A 为 n×(n+1) 矩阵 A_{i,k}=1_{i|k}（1≤i≤n,0≤k≤n），并令 B 为 (n+1)×n 矩阵
    B_{k,j}=1_{j|(n-k)}。先把 S 表为 AB。对 Cauchy--Binet 展开，比较 A 的删第 k 列子式与对应的 B 子式。再用 Möbius
    反演表达删列子式，最后化简有限和及符号。

'
  allowed_dependencies:
  - id: D1
    kind: definition
    statement: '指示函数 1_P 在命题 P 真时为 1、假时为 0；d|r 表示 d 整除 r。约定 0 的每个正因子均整除 0。

'
  - id: D2
    kind: standard_result
    statement: 'Cauchy--Binet（本例）：若 A 是 n×(n+1) 矩阵、B 是 (n+1)×n 矩阵，则 det(AB)=Σ_{k=0}^n
      det(A^{(k)})det(B^{(k)})，其中上标 (k) 表示删去第 k 个对应列/行后所得 n×n 矩阵。

'
  - id: D3
    kind: standard_result
    statement: 'Möbius 反演的列向量形式：若 v_k=Σ_{d|k}e_d（1≤k≤n），其中 e_1,…,e_n 为标准列向量，则 e_k=Σ_{d|k}
      μ(d)v_{k/d}；并且 Σ_{d|r}μ(d)=1（r=1）而在 r>1 时为 0。

'
  closed_book_notice: '只能使用本资料包。不得检索、使用工具、查看参考证明、评审规则或任何未列出的结果；若所需结论未被允许，请明确说明缺口。

'
judge_bundle:
  reference_proof: |
    记 A_{i,k}=1_{i|k}，B_{k,j}=1_{j|(n-k)}。则 (AB)_{ij} 是满足 i|k、j|(n-k)、0≤k≤n 的 k 的数目；映射 k↦(k/i,(n-k)/j) 是它与 ai+bj=n 的非负解之间的双射，故 S=AB。
    令 A^{(k)} 为 A 删第 k 列所得矩阵。B 是 A^T 经行次序反转所得，故 det B^{(k)}=(-1)^{n(n-1)/2}det A^{(n-k)}。于是
    det S=(-1)^{n(n-1)/2}Σ_{k=0}^n det A^{(k)}det A^{(n-k)}。
    写 A 的列为 v_0,…,v_n。A^{(0)} 是单位上三角型，故 det A^{(0)}=1。由 v_k=Σ_{d|k}e_d 及 Möbius 反演，令 C_k=Σ_{1≤d≤⌊n/k⌋}μ(d)（k≥1），可得 v_0=Σ_{k=1}^n C_kv_k。因此对 k≥1，det A^{(k)}=(-1)^{k-1}C_k；形式上置 C_0=-1 后该式亦统一可用。
    代入得 det S=(-1)^{n(n-1)/2+n-2}Σ_{k=0}^n C_kC_{n-k}。当 k>n/2 时 C_k=1；n 偶时 C_{n/2}=0。因此该和为 -2+2Σ_{k=1}^{⌊n/2⌋}C_k。交换求和并用 Σ_{d|r}μ(d) 的消去性质，得到 Σ_{k=1}^{⌊n/2⌋}C_k=1-⌈n/2⌉。故该卷积和为 -2⌈n/2⌉。将负号与前因子的奇偶性合并（直接按 n mod 4 检验），即得 det S=(-1)^{⌈n/2⌉-1}2⌈n/2⌉。
  key_lemmas:
  - lemma: S=AB 的双射计数。
    why_key: 这是把原计数问题转化为可用 Cauchy--Binet 的唯一桥梁。
    applicability_conditions: 必须保留 k∈[0,n] 与 a,b 非负的边界条件。
  - lemma: det B^{(k)}=(-1)^{n(n-1)/2}det A^{(n-k)}。
    why_key: 反转行与删去互补索引共同决定最终符号。
    applicability_conditions: 行指标为 0,…,n，反转为 r↦n-r。
  failure_mode_annotations:
