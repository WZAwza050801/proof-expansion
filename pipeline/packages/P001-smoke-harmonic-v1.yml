writer_bundle:
  statement: |
    定理：对任意整数 n ≥ 2，调和级数部分和
      H_n = 1 + 1/2 + 1/3 + ... + 1/n
    不是整数。
  proof_skeleton: |
    设 L_n = lcm(1,2,...,n)。用 L_n 乘以 H_n，得到
      L_n * H_n = Σ_{k=1..n} L_n / k ，
    这是一个整数。研究各项 L_n/k 的 2-进赋值：不超过 n 的最大 2 的幂
    应当恰好选出唯一一个具有最小赋值的项，其余项带有更高的 2 的幂。
    然后比较：若 H_n 是整数，L_n * H_n 的 2-进赋值应满足什么；这与
    前面的结论矛盾。
  allowed_dependencies:
    - id: D1
      kind: definition
      statement: |
        对非零有理数 x，2-进赋值 v_2(x)：把 x 写成 x = 2^a * u/v，
        其中 u、v 为奇数，则 v_2(x) = a。
        性质：v_2(xy) = v_2(x) + v_2(y)；
        若 v_2(x) ≠ v_2(y)，则 v_2(x + y) = min(v_2(x), v_2(y))。
    - id: D2
      kind: standard_result
      statement: |
        L_n = lcm(1,2,...,n) 能被每个 k ∈ {1,...,n} 整除，
        因此每个 L_n / k 都是整数。
    - id: D3
      kind: standard_result
      statement: |
        设 2^m 是不超过 n 的最大 2 的幂（m ≥ 1，且 n < 2^{m+1}）。
        对每个 k ∈ {1,...,n}：v_2(k) ≤ m；且 v_2(k) = m 当且仅当 k = 2^m。
  closed_book_notice: |
    只可使用本 bundle；不得检索、调用工具、读取任何文件或假定未列出的结果。

judge_bundle:
  reference_proof: |
    设 2^m 是不超过 n 的最大 2 的幂，m ≥ 1，且 n < 2^{m+1}。
    令 L = lcm(1,...,n)。由 D2，L/k ∈ Z，故 L·H_n = Σ_{k=1}^n L/k 是整数。
    由 D1，v_2(L/k) = v_2(L) − v_2(k)。
    对 k = 2^m：v_2(L/k) = v_2(L) − m。
    对 k ≠ 2^m：由 D3 得 v_2(k) ≤ m−1，故 v_2(L/k) ≥ v_2(L) − m + 1。
    因此恰有一项（k = 2^m）具有最小 2-进赋值 v_2(L) − m，
    其余各项都被 2^{v_2(L)−m+1} 整除。于是
      L·H_n = 2^{v_2(L)−m} · (奇数 + 偶数) = 2^{v_2(L)−m} · 奇数，
    从而 v_2(L·H_n) = v_2(L) − m < v_2(L)。
    若 H_n 是整数，则 L·H_n 是 L 的整数倍，必有 v_2(L·H_n) ≥ v_2(L)，
    矛盾。故 H_n 不是整数。
  key_lemmas:
    - lemma: "唯一最小项：在 {L/k : k=1..n} 中恰有一项（k=2^m）具有最小 2-进赋值 v_2(L)−m，其余项 ≥ v_2(L)−m+1"
      why_key: "整个矛盾论证依赖 奇数+偶数=奇数，即唯一最小赋值项"
      applicability_conditions: "需要 D3（最大 2 幂刻画）与 D1（赋值差公式）"
    - lemma: "整性迫使：若 H_n 为整数，则 v_2(L·H_n) ≥ v_2(L)"
      why_key: "矛盾的反向不等式"
      applicability_conditions: "需要 D2（L/k 为整数）"
  failure_mode_annotations:
    - "把唯一最小赋值项错写成'奇数个奇数项'：奇偶配对论证不适用于赋值结构"
    - "v_2(L/k) 方向写反或漏掉 v_2(L)−v_2(k) 这一差值"
    - "只讨论 L/k 的整数奇偶、跳过唯一最小赋值项的存在性"
  variants:
    - variant_id: full
      modification: "无修改。"
      writer_bundle_patch:
        remove_dependency_ids: []
        replace_statement: null
        replace_proof_skeleton: null
        append_allowed_dependencies: []
      expected_outcome: "按参考证明完成矛盾论证，结论 H_n 非整数。"
    - variant_id: missing_lemma
      modification: "从 writer_bundle 的 allowed_dependencies 中删除 D3（最大 2 幂刻画）。"
      writer_bundle_patch:
        remove_dependency_ids: [D3]
        replace_statement: null
        replace_proof_skeleton: |
          设 L_n = lcm(1,2,...,n)，并研究 L_n * H_n = Σ_{k=1..n} L_n/k 的
          2-进赋值。只能使用当前列出的允许依赖：若它们不足以确定关键项的
          2-进赋值结构，必须在证明中明确记录该缺口，不得把所需结论当作显然事实。
        append_allowed_dependencies: []
      expected_outcome: "写手无法论证'恰有一项具有最小赋值'；正确行为是标 unverified、记入缺口账本并以 incomplete/conditional 收尾；把该事实当显然事实硬用是错误行为。"

