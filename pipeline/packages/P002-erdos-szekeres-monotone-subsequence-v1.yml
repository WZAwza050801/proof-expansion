source_record:
  authors: "Paul Erdős; George Szekeres"
  title: "A combinatorial problem in geometry"
  year: "1935"
  url_or_doi_or_arxiv: "https://doi.org/10.1007/BF02049116"
  source_type: primary
  accessed_on: 2026-08-17
