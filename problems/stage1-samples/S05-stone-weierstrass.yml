selection_record:
  mathematical_area: 泛函分析 / 拓扑（连续函数代数）
  proof_structure: construction
  narrow_slot_design_rationale: |
    四步链中真正的 gap: (1) 闭包对 |f| 封闭（钥匙 D1 的 |t| 多项式逼近 + D2 换元收敛）;
    (2) 由分离性构造两点插值 f_xy（仿射组合，需要常值函数与代数封闭）;
    (3) U_y/V_x 双层开覆盖与 max/min 封闭的 sandwich。钥匙以依赖给足，拼接由写手自己完成。
  known_failure_modes:
    - |f| 逼近时换元不写（p_n(f/M) 的收敛性未核）
    - 两点插值构造未用仿射组合（g(x)≠g(y) 未归一化）
    - 第二层覆盖（V_x 一侧）漏掉或方向反（写成 g_x < h+ε 单侧）
    - 只用单层覆盖得出单侧不等式，未形成双侧 sandwich
    - lazy stop: 完成 S1/S2 后未推进插值与覆盖
  rejection_risk:
    - pro 裸题秒杀 → 对 pro 淘汰（flash 可能仍是窄缝）
    - 原文未获取: 入正式池前必须补原文

de_answering_record:
