  rationale: |
    定理（Stone–Weierstrass）是分析学标准结果，pro 大概率知道证明框架（|f| 逼近 + 格 + 插值覆盖）;
    flash 通常只能写出片段。本包把最冷的组合步骤（逐点插值仿射组合、双覆盖 sandwich）留作
    承重 gap，钥匙（Weierstrass 逼近、紧覆盖、max/min 恒等式）以依赖给足。预计 flash 裸题
    补不出、带包可补; pro 若裸题秒杀则对 pro 淘汰。
  pretest_protocol: |
    阶段2: ① 裸题探针(仅 statement)应失败或仅部分有效; ② 带包探针应 judge C>=3; 两条都满足才 confirmed
