narrow_slot_calibration:
  expected_standalone_solvability: medium
  rationale: |
    密度增量(density increment)与"先正则化再求平均"是加法组合的常见套路, 前沿模型大概率能写出
    "对某个平移 x 有 A-x 在 Bohr 集上高密度"这一类弱结论, 因此裸题不至于完全无效.
    但本引理的承重点在于"同步多膨胀"构造 B' = Π_j a_j·B_ε 与 B_i = Π_{j≠i} a_j·B_{ε·δ_i}
    (取 ε = α/(16k) 使 a_i·B_i = B'_{δ_i}), 以及由此得到的 7/8 与 (1+1/16k) 精确二分常数——
    这两处无法从领域直觉直接背出, 是带包才能补上的 gap.
  pretest_protocol: |
    阶段2: ① 裸题探针(仅 statement)应失败或仅部分有效; ② 带包探针应 judge C>=3; 两条都满足才 confirmed
  measured: confirmed   # 2026-08-18 预演: 裸题三模型全失败(flash 声称命题为假但无完整证明/pro 卡常数/27B 半途); 带包 flash/pro/27B 全部闭合二分证明. 注意: 三份带包证明一致指出"秩 d"在 D1-D4 下不可达、只能做到秩≤kd —— 蒸馏陈述与原文可能不一致, 入 ready 前必须人工对照原文核验
