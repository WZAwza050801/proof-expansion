selection_record:
  mathematical_area: 加法组合 (Bohr 集 / 密度增量)
  proof_structure: direct
  expected_output_scale: short
  narrow_slot_design_rationale: |
    最难补的 gap 是同步膨胀构造本身: 如何一次选好 B' 与 B_1..B_k, 使得 a_i·B_i = B'_{δ_i} 对所有 i 同时成立,
    且 ε=α/(16k) 的尺度恰好让二分常数 7/8 与 (1+1/16k) 在三角不等式+平均的收尾中闭合.
    钥匙是包里 D2(a·B 定义) 与 D3(正则卷积贴近) 两个依赖, 以及 proof_spine S1 给出的"按系数拆分膨胀"框架.
  known_failure_modes:
    - 只证出存在平移 x 使 |A∩(x+B)| 大, 没有同时携带 a_i 膨胀与 δ_i 结构, 结论弱化.
    - 把 Sanders/Bloom 型密度增量当作黑箱直接套用, 而非本引理特有的要么全部保持 7/8 要么某一路增益 1+1/16k二分.
    - 常数错乱: 用 ε=α/2 之类, 导致收尾处 (k-1/16)α-(k-1)(1+1/16k)α 无法≥(7/8)α.
    - 忽略 Z/pZ 假设, 在一般阿贝尔群里误用 a·B (那里没有乘以群元的良定义).
  rejection_risk:
    - 记法较技术(Bohr 集、dilate、regular、a·B), 写手若未逐字读依赖定义可能形式化漂移.
    - 需要 4 条 Bohr 集前置命题(正则贴近、正则膨胀存在性等)作为依赖, 包比单步引理略重.
