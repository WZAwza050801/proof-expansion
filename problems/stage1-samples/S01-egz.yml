selection_record:
  mathematical_area: 组合数论 / 零和问题
  proof_structure: key_lemma
  narrow_slot_design_rationale: |
    最难补的 gap 有两处: (1) 素数情形把"选 p 个且和为 0"编码成多项式方程组的非零解——
    钥匙是依赖 D1（计数定理）+ D2（幂次指示函数），但哪个多项式、怎么组合要写手自己搭;
    (2) 合成情形"反复提取 p-块再归纳"的计数论证，容易在剩余元素个数处出错。
    两个钥匙都以精确陈述给足，闭合路径存在且不显然。
  known_failure_modes:
    - 素数情形: 度数条件算错（写 2p-1 个变量却只用 p-1 次幂导致 D1 前提不成立）
    - 素数情形: 推出"公共零点数>=1"后直接结束，未用 D2 推出恰好 p 个非零分量
    - 合成情形: 提取 k 块后剩余个数算错，导致中途不够 2p-1 个而卡住
    - 合成情形: 归纳假设用错对象（对原始数组而非提取后的商数组用归纳）
    - lazy stop: 素数情形做不出即放弃，未先完成合成情形的归约框架
  rejection_risk:
    - 若预测试发现目标写手裸题即写出完整证明 -> 秒杀，淘汰
    - 原文未获取: 入正式池前必须补原文

