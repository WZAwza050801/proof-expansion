  title: Intersection theorems with geometric consequences
  year: 1981
  url_or_doi_or_arxiv: Combinatorica 1 (1981), 357–368
  source_type: primary
  source_pool: C_textbook_theorem
  accessed_on: 2026-08-18
  original_text_obtained: false
  evidence_status: verified
  likely_memorized: true
  memorization_note: |
    结论（含 Borsuk 反例推论）在教材与综述中高频出现（Alon–Spencer、Babai–Frankl、Matoušek），
    定理陈述易被记得; 完整证明的 h_A 构造记忆率显著低于结论本身。本包采用求和上界形式
    |F| ≤ Σ_{j≤p−1} C(n,j)（与原文 C(n,p−1) 形式的差别在 selection_record 说明）。
