writer_bundle:
  statement: |
    命题: 设 p 为素数，n ≥ 1 为整数，[n] = {1, 2, ..., n}。设 F 是 [n] 的子集族（F 中各成员互不相同），满足:
      (i) 存在固定的 k ∈ {0, 1, ..., p−1}，使每个 A ∈ F 都有 |A| ≡ k (mod p);
      (ii) 对任意两个不同的 A, B ∈ F: |A∩B| ≢ k (mod p)。
    证明: |F| ≤ C(n,0) + C(n,1) + ... + C(n,p−1)。

    符号约定: F_p 为模 p 的剩余类域。对 B ⊆ [n] 记 1_B = (b_1,...,b_n) ∈ {0,1}^n，其中 b_i = 1
    当且仅当 i ∈ B。多项式在 F_p 上时系数与取值按模 p 理解。C(n,j) 为组合数（j > n 时 C(n,j) = 0）。
  proof_spine:
    - step_id: S1
      objective: |
        对每个 A ∈ F 构造一个 F_p 上的 n 元多项式，其次数不超过 p−1，且满足: 对任意 B ∈ F，
        该多项式在点 1_B 处的取值，当 B = A 时为一个只依赖 p 的非零常数，当 B ≠ A 时为 0。
        提示框架: 这个多项式应"以 |A∩B| 的各个可能取值（模 p）为根的方向"去构造。
      completion_test: |
        多项式显式写出（每个因子的含义可核验）; 次数 ≤ p−1 已验证; 两个取值断言
        （B=A 时非零常数、B≠A 时 0）都有完整推导，其中非零常数的计算写清了模 p 结果。
    - step_id: S2
      objective: |
        把 S1 的多项式族转化为它们在各点上的函数，说明这些函数都属于同一个"低次多线性
        函数空间"，并证明它们在该空间中线性无关。
      completion_test: |
        写清"每个 {0,1}^n 上的函数有唯一多线性表示、且 S1 多项式的多线性表示次数 ≤ p−1"
        的论证; 线性无关性有完整证明（对任意非平凡线性组合，找到某个 1_B 使其取值非零）。
    - step_id: S3
      objective: |
        用低次多线性函数空间的维数得出 |F| 的上界，完成命题。
      completion_test: |
        维数 = C(n,0) + ... + C(n,p−1) 计算正确（单项式个数）; 结论 |F| ≤ 该维数与命题一致。
  allowed_dependencies:
    - id: D1
      kind: standard_result
      statement: |
        （威尔逊定理）对素数 p: (p−1)! ≡ −1 (mod p)。等价地，F_p 中全部非零元素的乘积为 −1。
    - id: D2
      kind: standard_result
      statement: |
        （乘积求值）设 k ∈ F_p，则 { k − a : a ∈ F_p, a ≠ k } = F_p \ {0}（恰为全部非零元素）。
        对整数 t 与 a ∈ F_p: 若 t ≢ a (mod p)，则乘积 Π_{a≠k}(t − a) ≡ 0 (mod p)，
        因为因子 (t − (t mod p)) 出现在其中。
    - id: D3
      kind: lemma
      statement: |
        （立方点上的函数与多线性多项式）{0,1}^n 上的每个 F_p 值函数 f 都有唯一的多线性表示:
          f(x) = Σ_{S ⊆ [n]} c_S · Π_{i∈S} x_i，
        且不同的多线性多项式给出不同的函数（多线性单项式 {Π_{i∈S} x_i : S ⊆ [n]} 线性无关）。
        进一步: 若 F_p 上多项式 g 的总次数 ≤ p−1，则 g 在 {0,1}^n 上诱导的函数的多线性表示
        只含 |S| ≤ p−1 的单项式。
    - id: D4
      kind: standard_result
      statement: |
        （线性代数基本事实）若向量空间 V 的维数为 N，v_1,...,v_m ∈ V 线性无关，则 m ≤ N。
        次数 ≤ p−1 的 n 元多线性单项式共有 C(n,0) + C(n,1) + ... + C(n,p−1) 个。
  claim_status_convention: |
    对证明中每个承重断言标注六态之一:
    - FIXED: 题目给定的目标或已定约定;
    - IMPORTED-VERIFIED: 引用允许依赖，且已核对适用前提;
    - PROVED-IN-PROJECT: 在本证明中给出完整证明;
    - CONDITIONAL: 在精确写出的未证输入下成立;
    - CANDIDATE: 提议的构造/策略，尚未建立;
    - BLOCKED: 被精确障碍阻住（须写出最小 blocker）。
    任何未加证明的承重断言不得无标签使用; BLOCKED 须附最小 blocker 与最强已证结论。
  writing_discipline: |
    1. 一个证明只回答一个主问题; 不复述题目包背景。
    2. 不使用"工作流/审计"类词汇，只写数学正文。
    3. 详细计算只出现在承重处（构造、取值计算、维数）; 例行步骤一笔带过。
    4. 补不动时: 报告最小 blocker 与最强已证定理，不堆砌"显然/标准论证"。
    5. 保守专业的数学文风: 自然段推进，公式与解释文字配比适度。
  closed_book_notice: |
    仅可使用本 bundle; 不得检索、不得假定未列出的结果、不得使用题目包外的定理名。

judge_bundle:
  theorem_name: Frankl–Wilson 多项式方法定理（1981，求和界形式）
  reference_proof: |
    对每个 A ∈ F 定义 F_p 上 n 元多项式
      f_A(x) = Π_{a ∈ F_p, a ≠ k} ( Σ_{i∈A} x_i − a ).
    每个因子是线性式，故 deg f_A = p−1。对 B ⊆ [n]，代入 x = 1_B:
      f_A(1_B) = Π_{a≠k} ( |A∩B| − a )  (mod p)。
    若 B ≠ A: 由 (ii)，|A∩B| ≢ k (mod p)，而 {a ∈ F_p : a ≠ k} = F_p \ {k} 含 |A∩B| 的
    剩余类，故乘积中有一因子 ≡ 0，即 f_A(1_B) = 0。
    若 B = A: |A∩B| = |A| ≡ k (mod p)，由 D2 与 D1:
      f_A(1_A) = Π_{a≠k}(k − a) = Π_{u ∈ F_p*} u = (p−1)! ≡ −1 (mod p)。
    由 D3，每个 f_A 在 {0,1}^n 上的函数有多线性表示 \bar f_A，只含 |S| ≤ p−1 的单项式。
    断言 {\bar f_A : A ∈ F} 线性无关: 若 Σ_{A∈F} c_A \bar f_A ≡ 0（在 {0,1}^n 上），则对每个
    B ∈ F 代入 1_B: 0 = Σ_A c_A f_A(1_B) = −c_B（因为 f_A(1_B) = −δ_{A,B}）。故全部 c_B = 0。
    由 D4，|F| ≤ C(n,0) + ... + C(n,p−1)。证毕。
  key_lemmas:
    - lemma: D3 立方点函数与多线性表示
      why_key: 把"次数 ≤ p−1 的多项式"与"低维多线性空间"对接，使维数论证可用
      applicability_conditions: 只关心 {0,1}^n 上的取值; 唯一性来自单项式独立性
    - lemma: D1 威尔逊定理
      why_key: B=A 时的取值恰为非零常数 −1，使消元法能逐项读出系数
      applicability_conditions: p 素数; 需要 {k−a : a≠k} = F_p*（D2）
  spine_answer_key:
    - step_id: S1
      full_closure: |
        f_A(x) = Π_{a≠k}(Σ_{i∈A} x_i − a); deg = p−1;
        B≠A: 因子 a ≡ |A∩B| (mod p) 使值为 0; B=A: Π_{a≠k}(k−a) = (p−1)! ≡ −1。
    - step_id: S2
      full_closure: |
        D3 给多线性表示 \bar f_A（|S| ≤ p−1）; 若 Σ c_A \bar f_A ≡ 0，代入 1_B 得
        −c_B = 0，故独立。
    - step_id: S3
      full_closure: |
        低次多线性空间维数 = Σ_{j≤p−1} C(n,j)（D4）; |F| ≤ 维数。
  failure_mode_annotations:
    - 构造的多项式次数 > p−1 或用了非齐次重量 → S1 completion_test 不过
    - B=A 取值误算（漏威尔逊或算成 0）→ 消元法失效
    - 只验证 A≠B 情形漏掉 A=B → 独立性证明不完整
  variants:
    - variant_id: full
      modification: "无修改"
      writer_bundle_patch: {}
      expected_outcome: 完整补出证明; judge 按 spine_answer_key 核补全度

