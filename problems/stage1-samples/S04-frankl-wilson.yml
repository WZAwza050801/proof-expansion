selection_record:
  mathematical_area: 极值组合 / 多项式方法
  proof_structure: construction
  narrow_slot_design_rationale: |
    最难补的 gap: (1) 构造一个次数 ≤ p−1 的多项式，使它在各成员特征向量上的取值"区分"该成员
    （即 A 处非零、其他成员处为 0）——钥匙是"把 |A∩B| 的每个可能残差都做成线性因子的根"，
    配合 D1（威尔逊）得到非零常数; (2) 多线性化降维 + 在 1_B 处求值消元的独立性论证。
    两个钥匙（D1/D3/D4）以精确陈述给足，组合方式由写手自己找。
    注: 原文的界是 C(n,p−1)（额外 L-条件版本）; 本包采用更稳的求和界形式（Σ_{j≤p−1}C(n,j)），
    证明完全自足，且是教材中的标准表述。
  known_failure_modes:
    - 构造的多项式次数 > p−1（如用 Π_{a≠k}(Σx_i − a·Σ全部变量) 之外的非齐次形式）导致维数论证失效
    - 忘记验证 A=B 时的取值是非零常数（漏用威尔逊或算错 ∏_{u∈F_p*}u）
    - 独立性论证只在 A≠B 处验证未覆盖 A=B
    - 多线性化后丢项（多项式在立方点上的函数与多线性表示的一一对应未写清）
    - lazy stop: 构造失败后未推进 S3 的维数结论
  rejection_risk:
    - pro 裸题秒杀 → 对 pro 淘汰（flash 可能仍是窄缝）
    - 原文未获取: 入正式池前必须补原文

