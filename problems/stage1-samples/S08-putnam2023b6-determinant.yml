    Putnam B6 级行列式题。官方解法依赖精心设计的行列变换（用第 n−1、n 行/列消掉带状
    之外的元素）+ 逐次 strike out 到 3×3/4×4 子式。变换的具体系数几乎不可能裸题猜出;
    给 D1–D3（行列式操作保持性、strike-out 引理、小矩阵计算）与脊柱（S 的结构事实 +
    "用后两行/列把中间行消成带状"）后，验证步是逐项代数，预计强模型带包可补。
  pretest_protocol: |
