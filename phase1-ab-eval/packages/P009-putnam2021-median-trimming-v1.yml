selection_record:
  proof_structure: induction
  discriminability_rationale: '此题把递归随机过程转成分布函数迭代，并要求处理对称性、密度变换、反函数面积与方向相反的不等式。模型通常能写出中位数密度，却容易错误地把
    F_k=F_1∘F_{k-1} 与 F_{k-1}∘F_1 混淆，或在取反函数时反转不等式。精细化过程提示应显著提高这些局部审计的完成率；题干给出了足够的标准工具，因而可产生部分有效步骤。

'
  known_failure_modes:
