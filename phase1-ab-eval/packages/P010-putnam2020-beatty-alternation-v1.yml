selection_record:
  proof_structure: induction
  discriminability_rationale: '该题需要把地板函数符号序列按常值簇重新编码，再把簇长度与互补斜率 √2+1 关联，最后执行尺度从 N
    到 4N 的强归纳。候选模型容易把严格/非严格不等式、索引从 0 或 1、以及 m 奇偶时的额外 c_m 项搞错。精细提示能显著暴露或修正这些细节；而提供簇长度引理后模型至少能推进到有效中段。

'
  known_failure_modes:
  - 把 floor 边界 i<j(√2+1)<i+1 写成非严格，导致簇归属错误。
  - 漏去从 k=0 到 k=1 的偏移，错误声称部分和相同。
  - 强归纳中未证明 m<2N+2，或偶数 m 时漏加 c_m。
  human_approval:
    approved_for_dev: true
    approved_for_eval: false
    approver: owner
