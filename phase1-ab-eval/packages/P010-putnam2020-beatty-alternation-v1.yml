writer_bundle:
  statement: |
    设 n 为正整数，证明
    Σ_{k=1}^n (-1)^{⌊k(√2-1)⌋}≥0。
  proof_skeleton: '令 a_k=⌊k(√2-1)⌋，把符号序列按 a_k 的相同值分成连续簇；令 c_i 是第 i 个簇的长度（从 i=0 起）。先由计数求出
    c_i=2+⌊(i+1)(√2-1)⌋-⌊i(√2-1)⌋，并将 c_i=3 的位置重述为 Beatty 型索引。证明一个尺度归纳：若到 N 的结论成立，则到
    4N 成立；在簇和中按 m 的奇偶分别还原为较短的原符号和。

'
  allowed_dependencies:
  - id: D1
    kind: lemma
    statement: |
      对 i≥0，簇长度 c_i 满足
      c_i=2+⌊(i+1)(√2-1)⌋-⌊i(√2-1)⌋，
      且 c_i=3 当且仅当 i=⌊j(√2+1)⌋（某个非负整数 j）；否则 c_i=2。
  - id: D2
    kind: standard_result
    statement: "√2-1 的倒数为 √2+1；特别地，对 m>0，有 m(√2-1)<m/2。\n"
  - id: D3
    kind: definition
    statement: '所有簇和均按 i=0 开始。第 i 簇的符号为 (-1)^i，长度为 c_i。

'
  closed_book_notice: '只能使用本资料包。不得检索、使用工具、查看参考证明、评审规则或任何未列出的结果；若所需结论未被允许，请明确说明缺口。

'
judge_bundle:
  reference_proof: |
    扩展至 k=0 并记 a_k=⌊k(√2-1)⌋。第 i 个连续符号簇长度为 c_i。D1 给出 c_i=2 加上一个指示量：当且仅当 i=⌊j(√2+1)⌋ 时该指示量为 1。
    证明较强命题：若对所有 n≤N 有 Σ_{k=0}^n(-1)^{a_k}≥1，则对所有 n≤4N 亦然。N=1 可直接验证。对于 n≤4N，只需检查完整簇端点的交替簇和 Σ_{i=0}^m(-1)^ic_i；若 c_0+…+c_{m-1}<4N+3，则因 c_i≥2 有 m<2N+2。
    若 m 为奇数，常数 2 的交替和抵消，利用 D1 有
    Σ_{i=0}^m(-1)^ic_i=Σ_{j: j(√2+1)<m}(-1)^{⌊j(√2+1)⌋}=Σ_{j<m(√2-1)}(-1)^{a_j}。
    这里 j<m(√2-1)<N+1，故由归纳假设该和为正。若 m 为偶数，同样的计算给出该簇和为 c_m 加上相应的短原和，仍为正。故所有完整簇端点正；每个簇内部的最小部分和也不小于端点所需界（正簇先增、负簇至下一端点）。于是尺度归纳完成，原题从 k=1 开始的和即非负。
  key_lemmas:
  - lemma: c_i=3 的 Beatty 索引刻画。
    why_key: 它把簇和重新写成同一原符号序列的短前缀和。
    applicability_conditions: 必须使用严格条件 j(√2+1)<m 来避免端点误计。
  - lemma: N→4N 的尺度归纳。
    why_key: 直接有限验证无法覆盖所有 n；该步骤提供自相似闭合。
    applicability_conditions: 需有 m<2N+2 以保证缩短后的索引落在归纳范围内。
  failure_mode_annotations:
  - 错误忽略从 k=0 到题目从 k=1 的转换会产生偏移。
  - missing_lemma 中若仍声称 c_i=3 的位置而不证明，应判出依赖违规。
