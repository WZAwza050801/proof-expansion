  proof_structure: induction
  narrow_slot_design_rationale: |
    gap = "周期 7 为什么是 7"（开局留 (1,n−3) / 留 (2,n−4) 导致 −7 位移）与上下界
    minimax 表达式的成立。D1（拆分子游戏求和）与 D3（末态=奇数段数）把局面语言翻译成
    数值语言，D2（pass 引理）处理"跟随策略"的边角。闭合需要把六张小表与归纳步拼齐。
  known_failure_modes:
    - 小情形表算错（a(4)=2 / b(4)=0 等）
    - 上界只写 max 忘 min（或反之），minimax 方向反
    - pass 引理未用导致跟随策略的合法性存疑
    - 忘了 n≡6 (mod 7) 时代入 2022 的余数
  rejection_risk:
    - 弱模型带包也可能补不出（博弈归纳繁琐）-> 则降为探针

